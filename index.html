<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="報告書" />
  <title>新津店 報告書ジェネレーター</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
      background: linear-gradient(180deg, #F7F4ED 0%, #EDE6D8 100%);
      color: #1F2937;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    #root { min-height: 100vh; }
    input, textarea, button, select { font-family: inherit; }
    input:focus, textarea:focus { border-color: #2D4A5F !important; }
    button:active { transform: scale(0.98); }
    button { transition: transform 0.05s ease, opacity 0.15s ease; }
    textarea { -webkit-appearance: none; }
  </style>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.7/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    // ============================================================
    // localStorage ヘルパー（自動保存・復元）
    // ============================================================
    const LS_WORK = 'niitsu_report_work_v1';
    const LS_LISSAGE = 'niitsu_report_lissage_v1';

    const loadLS = (key) => {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        return null;
      }
    };
    const saveLS = (key, obj) => {
      try { localStorage.setItem(key, JSON.stringify(obj)); } catch (e) {}
    };
    const clearLS = (key) => {
      try { localStorage.removeItem(key); } catch (e) {}
    };

    // ============================================================
    // ★ 設定: GAS Web App の URL を貼り付け
    // ============================================================
    const GAS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbzPzRWxx2Df5nFwpWxpCfvqVazBOZsu9mHsWmlybmC_bQ6um0P21BT82ue12-gOojrk/exec';

    // ============================================================
    // アイコン (inline SVG)
    // ============================================================
    const Icon = {
      ArrowLeft: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>,
      Copy: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>,
      Check: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>,
      Send: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>,
      FileText: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>,
    };

    // ============================================================
    // ヘルパー
    // ============================================================
    const fmtMD = (d) => `${d.getMonth() + 1}/${d.getDate()}`;
    const fmtNum = (s) => {
      const n = parseInt(String(s).replace(/,/g, ''), 10);
      return isNaN(n) ? '' : n.toLocaleString();
    };
    const todayStr = () => new Date().toISOString().split('T')[0];

    // ============================================================
    // メインアプリ
    // ============================================================
    function App() {
      // localStorage から前回データを復元
      const savedWork = loadLS(LS_WORK) || {};
      const savedLissage = loadLS(LS_LISSAGE) || {};

      const [view, setView] = useState('home');
      const [lastForm, setLastForm] = useState('work');
      const [reportText, setReportText] = useState('');
      const [copied, setCopied] = useState(false);
      const [sending, setSending] = useState(false);
      const [sendStatus, setSendStatus] = useState(null);
      const [restored, setRestored] = useState(
        (savedWork && Object.keys(savedWork).length > 0) ||
        (savedLissage && Object.keys(savedLissage).length > 0)
      );

      // 業務報告（前回データがあれば復元）
      const [workBaseDate, setWorkBaseDate] = useState(savedWork.workBaseDate || todayStr());
      const [salesAmount, setSalesAmount] = useState(savedWork.salesAmount || '');
      const [salesIsMinus, setSalesIsMinus] = useState(savedWork.salesIsMinus !== undefined ? savedWork.salesIsMinus : true);
      const [salesPercent, setSalesPercent] = useState(savedWork.salesPercent || '');
      const [profitAmount, setProfitAmount] = useState(savedWork.profitAmount || '');
      const [profitIsMinus, setProfitIsMinus] = useState(savedWork.profitIsMinus !== undefined ? savedWork.profitIsMinus : true);
      const [profitPercent, setProfitPercent] = useState(savedWork.profitPercent || '');
      const [workActions, setWorkActions] = useState(savedWork.workActions || '');
      const [workOther, setWorkOther] = useState(savedWork.workOther || '');

      // リサージ（前回データがあれば復元）
      const [lStartDate, setLStartDate] = useState(savedLissage.lStartDate || todayStr());
      const [lEndDate, setLEndDate] = useState(savedLissage.lEndDate || todayStr());
      const [lPeriodAmount, setLPeriodAmount] = useState(savedLissage.lPeriodAmount || '');
      const [lCallOut, setLCallOut] = useState(savedLissage.lCallOut || '');
      const [lPre, setLPre] = useState(savedLissage.lPre || '');
      const [l3AC, setL3AC] = useState(savedLissage.l3AC || '');
      const [lSkinMen, setLSkinMen] = useState(savedLissage.lSkinMen || '');
      const [lReflection, setLReflection] = useState(savedLissage.lReflection || '');
      const [lNextWeek, setLNextWeek] = useState(savedLissage.lNextWeek || '');

      // 業務報告データを自動保存
      useEffect(() => {
        saveLS(LS_WORK, {
          workBaseDate, salesAmount, salesIsMinus, salesPercent,
          profitAmount, profitIsMinus, profitPercent, workActions, workOther,
        });
      }, [workBaseDate, salesAmount, salesIsMinus, salesPercent,
          profitAmount, profitIsMinus, profitPercent, workActions, workOther]);

      // リサージデータを自動保存
      useEffect(() => {
        saveLS(LS_LISSAGE, {
          lStartDate, lEndDate, lPeriodAmount, lCallOut, lPre,
          l3AC, lSkinMen, lReflection, lNextWeek,
        });
      }, [lStartDate, lEndDate, lPeriodAmount, lCallOut, lPre,
          l3AC, lSkinMen, lReflection, lNextWeek]);

      // 業務報告フォームをリセット
      const resetWork = () => {
        setWorkBaseDate(todayStr());
        setSalesAmount(''); setSalesIsMinus(true); setSalesPercent('');
        setProfitAmount(''); setProfitIsMinus(true); setProfitPercent('');
        setWorkActions(''); setWorkOther('');
        clearLS(LS_WORK);
      };

      // リサージフォームをリセット
      const resetLissage = () => {
        setLStartDate(todayStr()); setLEndDate(todayStr());
        setLPeriodAmount(''); setLCallOut(''); setLPre('');
        setL3AC(''); setLSkinMen(''); setLReflection(''); setLNextWeek('');
        clearLS(LS_LISSAGE);
      };

      // 業務報告の期間自動計算（基準日の前日まで、必ず1日スタート）
      const workPeriod = useMemo(() => {
        if (!workBaseDate) return null;
        const base = new Date(workBaseDate + 'T00:00:00');
        let start, end;
        if (base.getDate() === 1) {
          start = new Date(base.getFullYear(), base.getMonth() - 1, 1);
          end = new Date(base.getFullYear(), base.getMonth(), 0);
        } else {
          start = new Date(base.getFullYear(), base.getMonth(), 1);
          end = new Date(base);
          end.setDate(end.getDate() - 1);
        }
        return { start, end };
      }, [workBaseDate]);

      // 文章生成
      const generateWork = () => {
        if (!workPeriod) return '';
        const period = `${fmtMD(workPeriod.start)}-${fmtMD(workPeriod.end)}まで`;
        const sP = salesIsMinus ? '▲' : '';
        const pP = profitIsMinus ? '▲' : '';
        const acts = workActions.split('\n').map(l => l.trim()).filter(Boolean).map(l => `・${l}`).join('\n');
        let t = `お疲れ様です。\n本日分業務報告です。\n${period}\n売上進捗：${sP}${fmtNum(salesAmount)}円　${salesPercent}％\n粗利進捗：${pP}${fmtNum(profitAmount)}円　${profitPercent}％\n実施したこと\n${acts}`;
        if (workOther.trim()) {
          const o = workOther.split('\n').map(l => l.trim()).filter(Boolean).join('\n');
          t += `\n【その他】\n${o}`;
        }
        t += `\n以上ご多用のところ恐れ入りますがご確認お願いします。`;
        return t;
      };

      const generateLissage = () => {
        const s = new Date(lStartDate + 'T00:00:00');
        const e = new Date(lEndDate + 'T00:00:00');
        const period = `${fmtMD(s)}〜${fmtMD(e)}`;
        const ref = lReflection.split('\n').map(l => l.trim()).filter(Boolean).map(l => `・${l}`).join('\n');
        const nw = lNextWeek.split('\n').map(l => l.trim()).filter(Boolean).map(l => `・${l}`).join('\n');
        return `リサージ活動報告です。\n${period}\n期間実績${fmtNum(lPeriodAmount)}円\n【活動】\n声掛け${lCallOut || 0}人\nプレ${lPre || 0}人\n3AC${l3AC || 0}人\nスキメン新規${lSkinMen || 0}人\n【振り返りと反省】\n${ref}\n【次週】\n${nw}`;
      };

      const handleCopy = async () => {
        try {
          await navigator.clipboard.writeText(reportText);
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        } catch (e) {
          // フォールバック
          const ta = document.createElement('textarea');
          ta.value = reportText;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        }
      };

      const handleSendLine = async () => {
        if (!GAS_WEBAPP_URL) {
          alert('GAS Web App URLが未設定です。\nHTMLファイル上部の GAS_WEBAPP_URL を設定してください。');
          return;
        }
        setSending(true);
        setSendStatus(null);
        try {
          const res = await fetch(GAS_WEBAPP_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ text: reportText }),
          });
          const data = await res.json();
          if (data && data.status === 'ok') {
            setSendStatus('success');
            // 送信成功 → 該当フォームの入力データをクリア
            if (lastForm === 'work') resetWork();
            else if (lastForm === 'lissage') resetLissage();
          } else {
            setSendStatus('error');
          }
        } catch (e) {
          setSendStatus('error');
        } finally {
          setSending(false);
        }
      };

      // === Styles ===
      const C = {
        bg: 'linear-gradient(180deg, #F7F4ED 0%, #EDE6D8 100%)',
        cardBg: '#FBF8F2',
        ink: '#1F2937',
        inkSoft: '#6B7280',
        border: '#E5DDD0',
        navy: '#2D4A5F',
        rose: '#8B4960',
        line: '#06C755',
        minus: '#C7544A',
        success: '#5A7D6A',
      };

      const inputStyle = {
        width: '100%', height: 48, padding: '0 14px', background: '#fff',
        border: `1px solid ${C.border}`, borderRadius: 10, fontSize: 16,
        color: C.ink, outline: 'none', WebkitAppearance: 'none',
      };
      const labelStyle = {
        fontSize: 13, color: C.inkSoft, fontWeight: 500,
        marginBottom: 6, display: 'block', letterSpacing: '0.02em',
      };
      const sectionTitle = (extra) => ({
        fontSize: 13, fontWeight: 700, color: C.ink, marginBottom: 10,
        paddingBottom: 6, borderBottom: `1px solid ${C.border}`,
        letterSpacing: '0.04em', ...extra,
      });

      // ============================================================
      // RENDER
      // ============================================================
      return (
        <div style={{ paddingBottom: 'env(safe-area-inset-bottom)' }}>
          <div style={{ maxWidth: 440, margin: '0 auto', padding: '24px 16px 140px' }}>

            {view === 'home' && (
              <>
                <div style={{ textAlign: 'center', marginBottom: 44, paddingTop: 32 }}>
                  <div style={{ fontSize: 11, color: C.inkSoft, letterSpacing: '0.25em', marginBottom: 8 }}>
                    NIITSU STORE  ·  2098
                  </div>
                  <h1 style={{ fontSize: 26, fontWeight: 700, color: C.ink, margin: 0, letterSpacing: '0.02em' }}>
                    報告書ジェネレーター
                  </h1>
                  <div style={{ width: 36, height: 2, background: C.navy, margin: '18px auto 0' }} />
                </div>

                <button
                  onClick={() => setView('work')}
                  style={{
                    width: '100%', padding: '26px 22px', background: C.navy, color: '#fff',
                    border: 'none', borderRadius: 16, marginBottom: 14, textAlign: 'left',
                    cursor: 'pointer', boxShadow: '0 6px 16px rgba(45,74,95,0.2)',
                  }}
                >
                  <div style={{ fontSize: 11, opacity: 0.65, marginBottom: 6, letterSpacing: '0.15em' }}>DAILY REPORT</div>
                  <div style={{ fontSize: 22, fontWeight: 700, marginBottom: 4 }}>業務報告</div>
                  <div style={{ fontSize: 13, opacity: 0.78 }}>日次 ・ 売上 / 粗利 / 実施事項</div>
                </button>

                <button
                  onClick={() => setView('lissage')}
                  style={{
                    width: '100%', padding: '26px 22px', background: C.rose, color: '#fff',
                    border: 'none', borderRadius: 16, textAlign: 'left',
                    cursor: 'pointer', boxShadow: '0 6px 16px rgba(139,73,96,0.2)',
                  }}
                >
                  <div style={{ fontSize: 11, opacity: 0.65, marginBottom: 6, letterSpacing: '0.15em' }}>WEEKLY REPORT</div>
                  <div style={{ fontSize: 22, fontWeight: 700, marginBottom: 4 }}>リサージ活動報告</div>
                  <div style={{ fontSize: 13, opacity: 0.78 }}>週次 ・ 活動実績 / 振り返り</div>
                </button>

                {restored && (
                  <div style={{
                    marginTop: 24, padding: '12px 14px', background: '#FFF8E8',
                    border: '1px solid #E8D9A8', borderRadius: 10,
                    fontSize: 12.5, color: '#7A6A3A', lineHeight: 1.6,
                  }}>
                    💾 前回の入力途中データが保存されています。フォームを開くと続きから編集できます。
                  </div>
                )}

                <div style={{ marginTop: restored ? 12 : 32, padding: 14, background: '#fff', borderRadius: 10, border: `1px solid ${C.border}`, fontSize: 12, color: C.inkSoft, lineHeight: 1.6 }}>
                  <strong style={{ color: C.ink }}>使い方:</strong> 報告種別を選択 → 項目入力 → 「文章を生成」→ コピー or LINE送信<br />
                  <span style={{ fontSize: 11 }}>※入力内容は自動保存。LINE送信が成功すると自動でクリアされます。</span>
                </div>
              </>
            )}

            {/* ===== 業務報告フォーム ===== */}
            {view === 'work' && (
              <>
                <Header onBack={() => setView('home')} title="業務報告" accent={C.navy}
                  onClear={() => { if (confirm('業務報告の入力内容をすべてクリアしますか？')) resetWork(); }} />

                <div style={{ marginBottom: 22 }}>
                  <label style={labelStyle}>基準日（この日の前日までが期間）</label>
                  <input type="date" value={workBaseDate}
                    onChange={(e) => setWorkBaseDate(e.target.value)} style={inputStyle} />
                  {workPeriod && (
                    <div style={{
                      marginTop: 10, padding: '12px 14px', background: '#fff',
                      border: `1.5px dashed ${C.navy}`, borderRadius: 10,
                      fontSize: 15, color: C.navy, fontWeight: 600, textAlign: 'center',
                    }}>
                      期間: {fmtMD(workPeriod.start)}-{fmtMD(workPeriod.end)}まで
                    </div>
                  )}
                </div>

                <div style={sectionTitle()}>売上進捗</div>
                <NumberRow label="金額" value={salesAmount} onChange={setSalesAmount}
                  isMinus={salesIsMinus} onToggleMinus={() => setSalesIsMinus(!salesIsMinus)}
                  suffix="円" C={C} placeholder="3358969" />
                <div style={{ marginTop: 12 }}>
                  <label style={labelStyle}>達成率（％）</label>
                  <input type="text" inputMode="decimal" value={salesPercent}
                    onChange={(e) => setSalesPercent(e.target.value)} style={inputStyle} placeholder="93.58" />
                </div>

                <div style={sectionTitle({ marginTop: 26 })}>粗利進捗</div>
                <NumberRow label="金額" value={profitAmount} onChange={setProfitAmount}
                  isMinus={profitIsMinus} onToggleMinus={() => setProfitIsMinus(!profitIsMinus)}
                  suffix="円" C={C} placeholder="636921" />
                <div style={{ marginTop: 12 }}>
                  <label style={labelStyle}>達成率（％）</label>
                  <input type="text" inputMode="decimal" value={profitPercent}
                    onChange={(e) => setProfitPercent(e.target.value)} style={inputStyle} placeholder="93.82" />
                </div>

                <div style={sectionTitle({ marginTop: 26 })}>実施したこと</div>
                <div style={{ fontSize: 11, color: C.inkSoft, marginBottom: 6 }}>1行=1項目（「・」は自動付与）</div>
                <textarea value={workActions} onChange={(e) => setWorkActions(e.target.value)}
                  placeholder="売場巡回メンテ&#10;欠品チェック&#10;入替リスト店番長報告&#10;前出し"
                  rows={6}
                  style={{ ...inputStyle, height: 'auto', padding: 14, resize: 'vertical', lineHeight: 1.7 }} />

                <div style={sectionTitle({ marginTop: 26 })}>その他（任意）</div>
                <textarea value={workOther} onChange={(e) => setWorkOther(e.target.value)}
                  placeholder="追加で報告したい事項があれば記入（空欄ならスキップ）" rows={3}
                  style={{ ...inputStyle, height: 'auto', padding: 14, resize: 'vertical', lineHeight: 1.7 }} />

                <FixedBottomButton color={C.navy} label="文章を生成" icon={<Icon.FileText />}
                  onClick={() => { setReportText(generateWork()); setLastForm('work'); setSendStatus(null); setView('result'); }} />
              </>
            )}

            {/* ===== リサージフォーム ===== */}
            {view === 'lissage' && (
              <>
                <Header onBack={() => setView('home')} title="リサージ活動報告" accent={C.rose}
                  onClear={() => { if (confirm('リサージ活動報告の入力内容をすべてクリアしますか？')) resetLissage(); }} />

                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, marginBottom: 22 }}>
                  <div>
                    <label style={labelStyle}>開始日</label>
                    <input type="date" value={lStartDate}
                      onChange={(e) => setLStartDate(e.target.value)} style={inputStyle} />
                  </div>
                  <div>
                    <label style={labelStyle}>終了日</label>
                    <input type="date" value={lEndDate}
                      onChange={(e) => setLEndDate(e.target.value)} style={inputStyle} />
                  </div>
                </div>

                <div style={sectionTitle()}>期間実績</div>
                <div style={{ position: 'relative' }}>
                  <input type="text" inputMode="numeric" value={fmtNum(lPeriodAmount)}
                    onChange={(e) => setLPeriodAmount(e.target.value.replace(/[^\d]/g, ''))}
                    style={{ ...inputStyle, paddingRight: 36 }} placeholder="62,549" />
                  <span style={{ position: 'absolute', right: 14, top: 13, color: C.inkSoft, fontSize: 14 }}>円</span>
                </div>

                <div style={sectionTitle({ marginTop: 26 })}>活動</div>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
                  <ActivityInput label="声掛け" value={lCallOut} onChange={setLCallOut} C={C} />
                  <ActivityInput label="プレ" value={lPre} onChange={setLPre} C={C} />
                  <ActivityInput label="3AC" value={l3AC} onChange={setL3AC} C={C} />
                  <ActivityInput label="スキメン新規" value={lSkinMen} onChange={setLSkinMen} C={C} />
                </div>

                <div style={sectionTitle({ marginTop: 26 })}>振り返りと反省</div>
                <div style={{ fontSize: 11, color: C.inkSoft, marginBottom: 6 }}>1行=1項目</div>
                <textarea value={lReflection} onChange={(e) => setLReflection(e.target.value)} rows={5}
                  style={{ ...inputStyle, height: 'auto', padding: 14, resize: 'vertical', lineHeight: 1.7 }}
                  placeholder="今週目標6万のところ、2日合計で55749円&#10;LINEを見てきてくださった方は接客販売した方の中には不在のため、別のアピール方法も実施" />

                <div style={sectionTitle({ marginTop: 26 })}>次週の取り組み</div>
                <textarea value={lNextWeek} onChange={(e) => setLNextWeek(e.target.value)} rows={4}
                  style={{ ...inputStyle, height: 'auto', padding: 14, resize: 'vertical', lineHeight: 1.7 }}
                  placeholder="接客台にホワイトボードを乗せて毎日違う取り組みを記載" />

                <FixedBottomButton color={C.rose} label="文章を生成" icon={<Icon.FileText />}
                  onClick={() => { setReportText(generateLissage()); setLastForm('lissage'); setSendStatus(null); setView('result'); }} />
              </>
            )}

            {/* ===== 結果表示 ===== */}
            {view === 'result' && (
              <>
                <Header onBack={() => setView(lastForm)} backLabel="編集に戻る"
                  title="生成された文章" accent={C.ink} />

                <div style={{
                  background: C.cardBg, border: `1px solid ${C.border}`, borderRadius: 12,
                  padding: 18, fontSize: 14.5, lineHeight: 1.9, whiteSpace: 'pre-wrap',
                  color: C.ink, marginBottom: 16, fontFamily: '"Hiragino Sans", "Yu Gothic", monospace',
                }}>
                  {reportText}
                </div>

                {sendStatus === 'success' && <StatusBar color={C.success} text="✓ LINE送信リクエストを送信しました" />}
                {sendStatus === 'error' && <StatusBar color={C.minus} text="✗ 送信に失敗しました（接続を確認）" />}

                <div style={{
                  position: 'fixed', bottom: 0, left: 0, right: 0,
                  padding: '12px 16px calc(12px + env(safe-area-inset-bottom))',
                  background: 'rgba(247,244,237,0.95)', backdropFilter: 'blur(12px)',
                  borderTop: `1px solid ${C.border}`,
                }}>
                  <div style={{ maxWidth: 440, margin: '0 auto', display: 'flex', gap: 10 }}>
                    <button onClick={handleCopy} style={{
                      flex: 1, height: 54, background: '#fff', color: C.ink,
                      border: `1.5px solid ${C.ink}`, borderRadius: 12, fontSize: 15,
                      fontWeight: 700, display: 'flex', alignItems: 'center',
                      justifyContent: 'center', gap: 6, cursor: 'pointer',
                    }}>
                      {copied ? (<><Icon.Check /> コピー完了</>) : (<><Icon.Copy /> コピー</>)}
                    </button>
                    <button onClick={handleSendLine} disabled={sending} style={{
                      flex: 1, height: 54, background: C.line, color: '#fff',
                      border: 'none', borderRadius: 12, fontSize: 15, fontWeight: 700,
                      display: 'flex', alignItems: 'center', justifyContent: 'center',
                      gap: 6, cursor: 'pointer', opacity: sending ? 0.6 : 1,
                    }}>
                      <Icon.Send /> {sending ? '送信中…' : 'LINE送信'}
                    </button>
                  </div>
                </div>
              </>
            )}
          </div>
        </div>
      );
    }

    // ============================================================
    // サブコンポーネント
    // ============================================================
    function Header({ onBack, title, accent, backLabel = '戻る', onClear }) {
      return (
        <div style={{ display: 'flex', alignItems: 'center', marginBottom: 26, gap: 8 }}>
          <button onClick={onBack} style={{
            height: 40, padding: '0 8px 0 8px', background: 'transparent',
            border: 'none', color: accent, fontSize: 14, fontWeight: 600,
            display: 'flex', alignItems: 'center', gap: 4, cursor: 'pointer',
          }}>
            <Icon.ArrowLeft /> {backLabel}
          </button>
          <h2 style={{ flex: 1, textAlign: 'right', fontSize: 18, fontWeight: 700, margin: 0, color: accent }}>
            {title}
          </h2>
          {onClear && (
            <button onClick={onClear} style={{
              height: 32, padding: '0 12px', background: 'transparent',
              border: '1px solid #D8CFC0', borderRadius: 8,
              color: '#9A8F7E', fontSize: 12, fontWeight: 600, cursor: 'pointer',
            }}>
              クリア
            </button>
          )}
        </div>
      );
    }

    function NumberRow({ label, value, onChange, isMinus, onToggleMinus, suffix, C, placeholder }) {
      const formatted = value ? parseInt(value.replace(/,/g, ''), 10).toLocaleString() : '';
      return (
        <div>
          <label style={{ fontSize: 13, color: C.inkSoft, fontWeight: 500, marginBottom: 6, display: 'block' }}>{label}</label>
          <div style={{ display: 'flex', gap: 8 }}>
            <button onClick={onToggleMinus} type="button" style={{
              width: 56, height: 48,
              border: `1.5px solid ${isMinus ? C.minus : C.border}`,
              background: isMinus ? C.minus : '#fff',
              color: isMinus ? '#fff' : C.inkSoft,
              borderRadius: 10, fontSize: 18, fontWeight: 700, cursor: 'pointer',
            }}>▲</button>
            <div style={{ position: 'relative', flex: 1 }}>
              <input type="text" inputMode="numeric" value={formatted}
                onChange={(e) => onChange(e.target.value.replace(/[^\d]/g, ''))}
                style={{
                  width: '100%', height: 48, padding: '0 36px 0 14px',
                  background: '#fff', border: `1px solid ${C.border}`,
                  borderRadius: 10, fontSize: 16, color: C.ink,
                  outline: 'none', WebkitAppearance: 'none',
                }} placeholder={placeholder} />
              <span style={{ position: 'absolute', right: 14, top: 13, color: C.inkSoft, fontSize: 14 }}>{suffix}</span>
            </div>
          </div>
        </div>
      );
    }

    function ActivityInput({ label, value, onChange, C }) {
      return (
        <div style={{ position: 'relative' }}>
          <label style={{ fontSize: 13, color: C.inkSoft, fontWeight: 500, marginBottom: 6, display: 'block' }}>{label}</label>
          <input type="text" inputMode="numeric" value={value}
            onChange={(e) => onChange(e.target.value.replace(/[^\d]/g, ''))}
            style={{
              width: '100%', height: 48, padding: '0 32px 0 14px',
              background: '#fff', border: `1px solid ${C.border}`,
              borderRadius: 10, fontSize: 16, color: C.ink,
              outline: 'none', WebkitAppearance: 'none',
            }} placeholder="0" />
          <span style={{ position: 'absolute', right: 12, top: 33, color: C.inkSoft, fontSize: 14 }}>人</span>
        </div>
      );
    }

    function FixedBottomButton({ onClick, color, label, icon }) {
      return (
        <div style={{
          position: 'fixed', bottom: 0, left: 0, right: 0,
          padding: '12px 16px calc(12px + env(safe-area-inset-bottom))',
          background: 'rgba(247,244,237,0.95)', backdropFilter: 'blur(12px)',
          borderTop: '1px solid #E5DDD0',
        }}>
          <div style={{ maxWidth: 440, margin: '0 auto' }}>
            <button onClick={onClick} style={{
              width: '100%', height: 56, background: color, color: '#fff',
              border: 'none', borderRadius: 14, fontSize: 16, fontWeight: 700,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              gap: 8, cursor: 'pointer', boxShadow: `0 6px 16px ${color}33`,
            }}>{icon} {label}</button>
          </div>
        </div>
      );
    }

    function StatusBar({ color, text }) {
      return (
        <div style={{
          padding: '12px 16px', background: color + '15',
          border: `1px solid ${color}40`, borderRadius: 10,
          color: color, fontSize: 14, fontWeight: 600, marginBottom: 16,
        }}>{text}</div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
