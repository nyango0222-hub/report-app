<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="報告書" />
  <title>新津店 報告書ジェネレーター</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
      background: linear-gradient(180deg, #F7F4ED 0%, #EDE6D8 100%);
      color: #1F2937;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    #root { min-height: 100vh; }
    input, textarea, button, select { font-family: inherit; }
    input:focus, textarea:focus { border-color: #2D4A5F !important; }
    button:active { transform: scale(0.98); }
    button { transition: transform 0.05s ease, opacity 0.15s ease; }
    textarea { -webkit-appearance: none; }
  </style>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.7/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef } = React;

    // ============================================================
    // localStorage ヘルパー（自動保存・復元）
    // ============================================================
    const LS_WORK = 'niitsu_report_work_v1';
    const LS_LISSAGE = 'niitsu_report_lissage_v1';

    const loadLS = (key) => {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        return null;
      }
    };
    const saveLS = (key, obj) => {
      try { localStorage.setItem(key, JSON.stringify(obj)); } catch (e) {}
    };
    const clearLS = (key) => {
      try { localStorage.removeItem(key); } catch (e) {}
    };

    // ============================================================
    // ★ 設定: GAS Web App の URL を貼り付け
    // ============================================================
    const GAS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbzPzRWxx2Df5nFwpWxpCfvqVazBOZsu9mHsWmlybmC_bQ6um0P21BT82ue12-gOojrk/exec';

    // ============================================================
    // アイコン (inline SVG)
    // ============================================================
    const Icon = {
      ArrowLeft: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>,
      Copy: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>,
      Check: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>,
      Send: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>,
      FileText: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>,
    };

    // ============================================================
    // ヘルパー
    // ============================================================
    const fmtMD = (d) => `${d.getMonth() + 1}/${d.getDate()}`;
    const fmtNum = (s) => {
      const n = parseInt(String(s).replace(/,/g, ''), 10);
      return isNaN(n) ? '' : n.toLocaleString();
    };
    const todayStr = () => new Date().toISOString().split('T')[0];


    // ============================================================
    // 写真OCR（売上予実画面の読み取り）
    // ============================================================
    // OCRテキストから金額（カンマ区切り）と％を出現順に取り出す
    const extractNums = (text) => {
      const t = String(text || '')
        .replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
        .replace(/，/g, ',').replace(/．/g, '.');
      const amounts = [];
      const aRe = /\d{1,3}(?:,\d{3})+|\d{4,}/g;
      let m;
      while ((m = aRe.exec(t)) !== null) {
        const v = parseInt(m[0].replace(/,/g, ''), 10);
        if (!isNaN(v)) amounts.push({ v, i: m.index });
      }
      const percents = [];
      const pRe = /(\d{1,3}\.\d{1,2})\s*%/g;
      while ((m = pRe.exec(t)) !== null) {
        percents.push({ v: parseFloat(m[1]), raw: m[1], i: m.index });
      }
      return { amounts, percents };
    };

    // 金額列から「実績・予実差・予実比」の組を探す。
    // 予実比 = 実績 / 予算、予算 = 実績 - 予実差、の関係で照合する。
    // 逆算した予算が金額列にも載っている組を「売上側」、載っていない組を「粗利側」と判定する。
    const findTriples = (text) => {
      const { amounts, percents } = extractNums(text);
      const best = {};
      for (let a = 0; a < amounts.length; a++) {
        for (let b = 0; b < amounts.length; b++) {
          if (b === a) continue;
          const actual = amounts[a].v, diffAbs = amounts[b].v;
          if (actual <= 0 || diffAbs <= 0 || diffAbs >= actual) continue;
          for (const sgn of [-1, 1]) {
            const diff = sgn * diffAbs;
            const budget = actual - diff;
            if (budget <= 0) continue;
            const ratio = actual / budget * 100;
            for (const p of percents) {
              const err = Math.abs(p.v - ratio);
              if (err > 0.02) continue;
              const side = amounts.some((x) => x.v === budget) ? 'sales' : 'profit';
              if (!best[side] || err < best[side].err) {
                best[side] = { actual, diff, percent: p.raw, err };
              }
            }
          }
        }
      }
      // 売上側の数字の組み合わせ違いでできた粗利候補を除く
      // （粗利の実績が売上の予算と一致する／予実差が売上と同一、の場合は売上の誤検出）
      if (best.sales && best.profit) {
        const sBudget = best.sales.actual - best.sales.diff;
        if (best.profit.actual === sBudget || best.profit.diff === best.sales.diff) {
          delete best.profit;
        }
      }
      return best;
    };


    // 日次生産性シートのOCRテキストから、5指標×（予算・実績）の10個の数字を取り出す。
    // 「売上高÷労働時間≒人時売上高」「POS粗利÷労働時間≒人時生産性」の関係で照合し、
    // グラフの目盛りなどの紛らわしい数字を除外する。
    const extractProductivity = (text) => {
      const t = String(text || '')
        .replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
        .replace(/，/g, ',');
      const vals = [];
      const re = /\d{1,3}(?:,\d{3})+|\d{3,}/g;
      let m;
      while ((m = re.exec(t)) !== null) {
        const v = parseInt(m[0].replace(/,/g, ''), 10);
        if (!isNaN(v)) vals.push(v);
      }
      const near = (x, y) => Math.abs(x - y) <= y * 0.004 + 2;
      for (let i = 0; i + 10 <= vals.length; i++) {
        const w = vals.slice(i, i + 10);
        if (w[8] <= 0 || w[9] <= 0) continue;
        if (near(w[4] / w[8], w[0]) && near(w[5] / w[9], w[1]) &&
            near(w[6] / w[8], w[2]) && near(w[7] / w[9], w[3])) {
          return w;
        }
      }
      return null;
    };

    // ============================================================
    // メインアプリ
    // ============================================================
    function App() {
      // localStorage から前回データを復元
      const savedWork = loadLS(LS_WORK) || {};
      const savedLissage = loadLS(LS_LISSAGE) || {};

      const [view, setView] = useState('home');
      const [lastForm, setLastForm] = useState('work');
      const [reportText, setReportText] = useState('');
      const [copied, setCopied] = useState(false);
      const [sending, setSending] = useState(false);
      const [sendStatus, setSendStatus] = useState(null);
      const [restored, setRestored] = useState(
        (savedWork && Object.keys(savedWork).length > 0) ||
        (savedLissage && Object.keys(savedLissage).length > 0)
      );

      // 業務報告（前回データがあれば復元）
      const [workBaseDate, setWorkBaseDate] = useState(savedWork.workBaseDate || todayStr());
      const [salesAmount, setSalesAmount] = useState(savedWork.salesAmount || '');
      const [salesIsMinus, setSalesIsMinus] = useState(savedWork.salesIsMinus !== undefined ? savedWork.salesIsMinus : true);
      const [salesPercent, setSalesPercent] = useState(savedWork.salesPercent || '');
      const [profitAmount, setProfitAmount] = useState(savedWork.profitAmount || '');
      const [profitIsMinus, setProfitIsMinus] = useState(savedWork.profitIsMinus !== undefined ? savedWork.profitIsMinus : true);
      const [profitPercent, setProfitPercent] = useState(savedWork.profitPercent || '');
      const [workActions, setWorkActions] = useState(savedWork.workActions || '');
      const [workOther, setWorkOther] = useState(savedWork.workOther || '');

      // 写真OCR（業務報告の売上・粗利）
      const ocrFileRef = useRef(null);
      const [ocrBusy, setOcrBusy] = useState(false);
      const [ocrStatus, setOcrStatus] = useState('');

      const runPhotoOcr = async (files) => {
        if (!window.Tesseract) {
          setOcrStatus('読み取り用の部品を読み込めませんでした。通信環境を確認して、ページを開き直してください。');
          return;
        }
        setOcrBusy(true);
        setOcrStatus('読み取り中…（初回は少し時間がかかります）');
        let worker = null;
        const results = {};
        let failed = false;
        try {
          worker = await Tesseract.createWorker('eng');
          await worker.setParameters({ tessedit_char_whitelist: '0123456789,.%-' });
          for (const file of files) {
            const url = URL.createObjectURL(file);
            try {
              const img = await new Promise((res, rej) => {
                const im = new Image();
                im.onload = () => res(im);
                im.onerror = rej;
                im.src = url;
              });
              const scale = Math.min(1, 1600 / (img.naturalWidth || 1600));
              const cv = document.createElement('canvas');
              cv.width = Math.round(img.naturalWidth * scale);
              cv.height = Math.round(img.naturalHeight * scale);
              cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
              const { data } = await worker.recognize(cv);
              const triples = findTriples(data.text || '');
              for (const side of ['sales', 'profit']) {
                if (triples[side] && !results[side]) results[side] = triples[side];
              }
            } finally {
              URL.revokeObjectURL(url);
            }
          }
        } catch (e) {
          failed = true;
        } finally {
          if (worker) { try { await worker.terminate(); } catch (e) {} }
        }
        if (results.sales) {
          setSalesAmount(String(Math.abs(results.sales.diff)));
          setSalesIsMinus(results.sales.diff < 0);
          setSalesPercent(results.sales.percent);
        }
        if (results.profit) {
          setProfitAmount(String(Math.abs(results.profit.diff)));
          setProfitIsMinus(results.profit.diff < 0);
          setProfitPercent(results.profit.percent);
        }
        const lines = [];
        if (results.sales) lines.push(`売上進捗：${results.sales.diff < 0 ? '▲' : ''}${fmtNum(Math.abs(results.sales.diff))}円　${results.sales.percent}％`);
        if (results.profit) lines.push(`粗利進捗：${results.profit.diff < 0 ? '▲' : ''}${fmtNum(Math.abs(results.profit.diff))}円　${results.profit.percent}％`);
        if (lines.length) {
          setOcrStatus('読み取りました。画面の数字と合っているか見比べてください。\n' + lines.join('\n'));
        } else if (failed) {
          setOcrStatus('読み取りでエラーが出ました。写真を選び直すか、手入力してください。');
        } else {
          setOcrStatus('数字を読み取れませんでした。画面いっぱいに大きく撮るか、手入力してください。');
        }
        setOcrBusy(false);
      };

      // 日次生産性（前日分）
      const [dPerSalesB, setDPerSalesB] = useState(savedWork.dPerSalesB || '');
      const [dPerSalesA, setDPerSalesA] = useState(savedWork.dPerSalesA || '');
      const [dPerProfitB, setDPerProfitB] = useState(savedWork.dPerProfitB || '');
      const [dPerProfitA, setDPerProfitA] = useState(savedWork.dPerProfitA || '');
      const [dSalesB, setDSalesB] = useState(savedWork.dSalesB || '');
      const [dSalesA, setDSalesA] = useState(savedWork.dSalesA || '');
      const [dProfitB, setDProfitB] = useState(savedWork.dProfitB || '');
      const [dProfitA, setDProfitA] = useState(savedWork.dProfitA || '');
      const [dHoursB, setDHoursB] = useState(savedWork.dHoursB || '');
      const [dHoursA, setDHoursA] = useState(savedWork.dHoursA || '');
      const prodFileRef = useRef(null);
      const [prodBusy, setProdBusy] = useState(false);
      const [prodStatus, setProdStatus] = useState('');

      const runProdOcr = async (file) => {
        if (!window.Tesseract) {
          setProdStatus('読み取り用の部品を読み込めませんでした。通信環境を確認して、ページを開き直してください。');
          return;
        }
        setProdBusy(true);
        setProdStatus('読み取り中…（初回は少し時間がかかります）');
        let worker = null;
        let vals = null;
        let failed = false;
        try {
          worker = await Tesseract.createWorker('eng');
          await worker.setParameters({ tessedit_char_whitelist: '0123456789,.%-' });
          const url = URL.createObjectURL(file);
          try {
            const img = await new Promise((res, rej) => {
              const im = new Image();
              im.onload = () => res(im);
              im.onerror = rej;
              im.src = url;
            });
            const scale = Math.min(1, 2000 / (img.naturalWidth || 2000));
            const cv = document.createElement('canvas');
            cv.width = Math.round(img.naturalWidth * scale);
            cv.height = Math.round(img.naturalHeight * scale);
            cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
            const { data } = await worker.recognize(cv);
            vals = extractProductivity(data.text || '');
          } finally {
            URL.revokeObjectURL(url);
          }
        } catch (e) {
          failed = true;
        } finally {
          if (worker) { try { await worker.terminate(); } catch (e) {} }
        }
        if (vals) {
          setDPerSalesB(String(vals[0])); setDPerSalesA(String(vals[1]));
          setDPerProfitB(String(vals[2])); setDPerProfitA(String(vals[3]));
          setDSalesB(String(vals[4])); setDSalesA(String(vals[5]));
          setDProfitB(String(vals[6])); setDProfitA(String(vals[7]));
          setDHoursB(String(vals[8])); setDHoursA(String(vals[9]));
          setProdStatus('読み取りました。画面の数字と合っているか見比べてください。');
        } else if (failed) {
          setProdStatus('読み取りでエラーが出ました。写真を選び直すか、手入力してください。');
        } else {
          setProdStatus('数字を読み取れませんでした。表が大きく写るように撮るか、手入力してください。');
        }
        setProdBusy(false);
      };

      // リサージ（前回データがあれば復元）
      const [lStartDate, setLStartDate] = useState(savedLissage.lStartDate || todayStr());
      const [lEndDate, setLEndDate] = useState(savedLissage.lEndDate || todayStr());
      const [lPeriodAmount, setLPeriodAmount] = useState(savedLissage.lPeriodAmount || '');
      const [lCallOut, setLCallOut] = useState(savedLissage.lCallOut || '');
      const [lPre, setLPre] = useState(savedLissage.lPre || '');
      const [l3AC, setL3AC] = useState(savedLissage.l3AC || '');
      const [lSkinMen, setLSkinMen] = useState(savedLissage.lSkinMen || '');
      const [lReflection, setLReflection] = useState(savedLissage.lReflection || '');
      const [lNextWeek, setLNextWeek] = useState(savedLissage.lNextWeek || '');

      // 業務報告データを自動保存
      useEffect(() => {
        saveLS(LS_WORK, {
          workBaseDate, salesAmount, salesIsMinus, salesPercent,
          profitAmount, profitIsMinus, profitPercent, workActions, workOther,
          dPerSalesB, dPerSalesA, dPerProfitB, dPerProfitA, dSalesB, dSalesA,
          dProfitB, dProfitA, dHoursB, dHoursA,
        });
      }, [workBaseDate, salesAmount, salesIsMinus, salesPercent,
          profitAmount, profitIsMinus, profitPercent, workActions, workOther,
          dPerSalesB, dPerSalesA, dPerProfitB, dPerProfitA, dSalesB, dSalesA,
          dProfitB, dProfitA, dHoursB, dHoursA]);

      // リサージデータを自動保存
      useEffect(() => {
        saveLS(LS_LISSAGE, {
          lStartDate, lEndDate, lPeriodAmount, lCallOut, lPre,
          l3AC, lSkinMen, lReflection, lNextWeek,
        });
      }, [lStartDate, lEndDate, lPeriodAmount, lCallOut, lPre,
          l3AC, lSkinMen, lReflection, lNextWeek]);

      // 業務報告フォームをリセット
      const resetWork = () => {
        setWorkBaseDate(todayStr());
        setSalesAmount(''); setSalesIsMinus(true); setSalesPercent('');
        setProfitAmount(''); setProfitIsMinus(true); setProfitPercent('');
        setWorkActions(''); setWorkOther('');
        setDPerSalesB(''); setDPerSalesA(''); setDPerProfitB(''); setDPerProfitA('');
        setDSalesB(''); setDSalesA(''); setDProfitB(''); setDProfitA('');
        setDHoursB(''); setDHoursA('');
        setOcrStatus(''); setProdStatus('');
        clearLS(LS_WORK);
      };

      // リサージフォームをリセット
      const resetLissage = () => {
        setLStartDate(todayStr()); setLEndDate(todayStr());
        setLPeriodAmount(''); setLCallOut(''); setLPre('');
        setL3AC(''); setLSkinMen(''); setLReflection(''); setLNextWeek('');
        clearLS(LS_LISSAGE);
      };

      // 業務報告の期間自動計算（基準日の前日まで、必ず1日スタート）
      const workPeriod = useMemo(() => {
        if (!workBaseDate) return null;
        const base = new Date(workBaseDate + 'T00:00:00');
        let start, end;
        if (base.getDate() === 1) {
          start = new Date(base.getFullYear(), base.getMonth() - 1, 1);
          end = new Date(base.getFullYear(), base.getMonth(), 0);
        } else {
          start = new Date(base.getFullYear(), base.getMonth(), 1);
          end = new Date(base);
          end.setDate(end.getDate() - 1);
        }
        return { start, end };
      }, [workBaseDate]);

      // 日次生産性ブロック（10項目すべて入っているときだけ生成）
      const buildProductivityText = () => {
        if (!workPeriod) return '';
        const raw = [dPerSalesB, dPerSalesA, dPerProfitB, dPerProfitA, dSalesB, dSalesA, dProfitB, dProfitA, dHoursB, dHoursA];
        const nums = raw.map((s) => parseInt(String(s).replace(/,/g, ''), 10));
        if (nums.some((n) => isNaN(n))) return '';
        const judge = (b, a, lowerBetter) => ((lowerBetter ? a <= b : a >= b) ? '達成！' : '未達');
        const wd = ['日', '月', '火', '水', '木', '金', '土'][workPeriod.end.getDay()];
        const lines = [
          `(前日)日次生産性-${fmtMD(workPeriod.end)}(${wd})`,
          '【人時売上高】',
          `予算${fmtNum(nums[0])}円　実績${fmtNum(nums[1])}円　${judge(nums[0], nums[1], false)}`,
          '【人時生産性】',
          `予算${fmtNum(nums[2])}円　実績${fmtNum(nums[3])}円　${judge(nums[2], nums[3], false)}`,
          '【売上高】',
          `予算${fmtNum(nums[4])}円　実績${fmtNum(nums[5])}円　${judge(nums[4], nums[5], false)}`,
          '【POS粗利】',
          `予算${fmtNum(nums[6])}円　実績${fmtNum(nums[7])}円　${judge(nums[6], nums[7], false)}`,
          '【労働時間】',
          `予算${fmtNum(nums[8])}時間　実績${fmtNum(nums[9])}時間　${judge(nums[8], nums[9], true)}`,
        ];
        return lines.join('\n');
      };

      // 文章生成
      const generateWork = () => {
        if (!workPeriod) return '';
        const period = `${fmtMD(workPeriod.start)}-${fmtMD(workPeriod.end)}まで`;
        const sP = salesIsMinus ? '▲' : '';
        const pP = profitIsMinus ? '▲' : '';
        const acts = workActions.split('\n').map(l => l.trim()).filter(Boolean).map(l => `・${l}`).join('\n');
        let t = `お疲れ様です。\n本日分業務報告です。\n${period}\n売上進捗：${sP}${fmtNum(salesAmount)}円　${salesPercent}％\n粗利進捗：${pP}${fmtNum(profitAmount)}円　${profitPercent}％\n実施したこと\n${acts}`;
        const prodText = buildProductivityText();
        if (prodText) t += `\n\n${prodText}`;
        if (workOther.trim()) {
          const o = workOther.split('\n').map(l => l.trim()).filter(Boolean).join('\n');
          t += `\n\n【その他】\n${o}`;
        }
        t += `\n以上ご多用のところ恐れ入りますがご確認お願いします。`;
        return t;
      };

      const generateLissage = () => {
        const s = new Date(lStartDate + 'T00:00:00');
        const e = new Date(lEndDate + 'T00:00:00');

        try {
          await navigator.clipboard.writeText(reportText);

          // フォールバック
          const ta = document.createElement('textarea');
          ta.value = reportText;
          document.body.appendChild(ta);

          document.body.removeChild(ta);
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);

      const handleSendLine = async () => {

          return;

        setSendStatus(null);
        try {
          const res = await fetch(GAS_WEBAPP_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ text: reportText }),
          });
          const data = await res.json();
          if (data && data.status === 'ok') {
            setSendStatus('success');

            if (lastForm === 'work') resetWork();

          padding: '12px 16px', background: color + '15',
          border: `1px solid ${color}40`, borderRadius: 10,
          color: color, fontSize: 14, fontWeight: 600, marginBottom: 16,
        }}>{text}</div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
